name: Publish private YouTube briefing

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type UPLOAD to create or reconcile a private YouTube video
        required: true
      voice:
        description: Kokoro voice identifier
        required: true
        default: af_heart

permissions:
  contents: read

concurrency:
  group: youtube-publish
  cancel-in-progress: false

jobs:
  publish-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require explicit upload confirmation
        run: test "${{ inputs.confirmation }}" = UPLOAD
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements-media.txt
      - name: Install media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg espeak-ng
          python -m pip install -r pipeline/requirements-media.txt
      - name: Generate validated edition
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m pipeline.live_preview --media --voice "${{ inputs.voice }}"
      - name: Upload or reconcile private YouTube video
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PLAYLIST_ID: ${{ secrets.YOUTUBE_PLAYLIST_ID }}
        run: python -m pipeline.publish_youtube "preview/$(date -u +%F)" --privacy private
      - name: Preserve YouTube publication record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-publication-record
          path: preview/
          retention-days: 30
          if-no-files-found: error
