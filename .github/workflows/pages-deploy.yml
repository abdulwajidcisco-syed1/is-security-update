name: Deploy public briefing website

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to publish the generated website publicly
        required: true
      voice:
        description: Kokoro voice identifier
        required: true
        default: af_heart

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require explicit public-deployment confirmation
        run: test "${{ inputs.confirmation }}" = DEPLOY
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements-media.txt
      - name: Install media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg espeak-ng
          python -m pip install -r pipeline/requirements-media.txt
      - name: Build validated public site
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m pipeline.live_preview --media --voice "${{ inputs.voice }}"
      - name: Stage Pages artifact
        shell: bash
        run: |
          site="$(find preview -mindepth 2 -maxdepth 2 -type d -name site -print -quit)"
          test -n "$site"
          mkdir _site
          cp -a "$site"/. _site/
          test -s _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed archive and episode
        shell: bash
        run: |
          base="${{ steps.deployment.outputs.page_url }}"
          curl --fail --location --retry 6 --retry-delay 10 "$base" >/dev/null
          curl --fail --location --retry 6 --retry-delay 10 "${base}episodes/$(date -u +%F)/" >/dev/null