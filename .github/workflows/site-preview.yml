name: Website archive preview

on:
  workflow_dispatch:
    inputs:
      voice:
        description: Kokoro voice identifier
        required: true
        default: af_heart

permissions:
  contents: read

concurrency:
  group: website-preview
  cancel-in-progress: false

jobs:
  build-site:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements-media.txt
      - name: Install media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg espeak-ng
          python -m pip install -r pipeline/requirements-media.txt
      - name: Build deployable site artifact
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m pipeline.live_preview --media --voice "${{ inputs.voice }}"
      - name: Upload inspectable site bundle
        uses: actions/upload-artifact@v4
        with:
          name: website-archive-preview
          path: preview/
          retention-days: 7
          if-no-files-found: error