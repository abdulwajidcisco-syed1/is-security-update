name: Active-day media capacity benchmark

on:
  workflow_dispatch:
    inputs:
      voice:
        description: Kokoro voice identifier
        required: true
        default: af_heart

permissions:
  contents: read

concurrency:
  group: media-capacity-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements-media.txt
      - name: Install media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg espeak-ng
          python -m pip install -r pipeline/requirements-media.txt
      - name: Render synthetic non-publishing benchmark
        run: python -m pipeline.benchmark --voice "${{ inputs.voice }}"
      - name: Validate benchmark artifacts
        run: |
          test -s benchmark-media/audio.mp3
          test -s benchmark-media/video.mp4
          test -s benchmark-media/captions.srt
          test -s benchmark-media/media.json
      - uses: actions/upload-artifact@v4
        with:
          name: active-day-media-benchmark
          path: benchmark-media/
          retention-days: 7
          if-no-files-found: error
