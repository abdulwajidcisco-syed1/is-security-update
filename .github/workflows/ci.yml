name: Offline pipeline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned dependencies
        run: python -m pip install -r pipeline/requirements.txt
      - name: Run offline acceptance tests
        run: python -m unittest discover -s tests -v
      - name: Exercise dry run and resume
        run: |
          python -m pipeline.run --dry-run --fixture tests/fixtures/news.json --window-end 2026-09-12T08:00:00Z
          python -m pipeline.run --dry-run --fixture tests/fixtures/news.json --window-end 2026-09-12T08:00:00Z --resume
