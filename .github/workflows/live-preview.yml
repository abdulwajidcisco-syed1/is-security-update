name: Live briefing preview

on:
  workflow_dispatch:
    inputs:
      window_end:
        description: Optional ISO-8601 UTC window end
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: live-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r pipeline/requirements.txt
      - name: Generate review-only preview
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          args=()
          if [[ -n "${{ inputs.window_end }}" ]]; then args+=(--window-end "${{ inputs.window_end }}"); fi
          python -m pipeline.live_preview "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: briefing-preview
          path: preview/
          retention-days: 7
          if-no-files-found: error
